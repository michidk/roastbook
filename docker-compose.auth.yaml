services:
  postgres:
    image: postgres:18@sha256:6d732ddbc9cca651c7cbda3f2b84bc515c6d09de796204176c9e312ce8069c6c
    restart: unless-stopped
    environment:
      POSTGRES_DB: roastbook
      POSTGRES_USER: roastbook
      POSTGRES_PASSWORD: roastbook
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastbook -d roastbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      args:
        VITE_HEAD_HTML: ${VITE_HEAD_HTML:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook

  app: &authenticated-app
    build:
      context: .
      args:
        VITE_HEAD_HTML: ${VITE_HEAD_HTML:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    ports:
      # MCP requires a per-user bearer token. Keep the direct device port private.
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      AUTH_ENABLED: "true"
      PUBLIC_URL: ${PUBLIC_URL:-${AUTH_URL:-}}
      AUTH_SECRET: ${AUTH_SECRET:?Set a random secret with at least 32 characters}
      AUTH_SIGNUP_ENABLED: ${AUTH_SIGNUP_ENABLED:-false}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:?Set your email address to become administrator}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:?Set the sender address}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_PROVIDER: local
      STORAGE_PATH: /uploads
      STORAGE_URL: /media
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_ALLOWED_PRIVATE_ORIGINS: ${AI_ALLOWED_PRIVATE_ORIGINS:-}
    volumes:
      - uploads:/uploads


  worker:
    <<: *authenticated-app
    command: ["bun", "run", "worker"]
    ports: []
    expose: []

volumes:
  postgres_data:
  uploads:

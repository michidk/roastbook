# Public browser origin, such as https://coffee.example.com. Required for built-in
# accounts (or set PUBLIC_URL in auth.existingSecret); behind Hodor or another
# proxy it keeps write origin checks working. auth.url is the former name.
publicUrl: ""

replicaCount: 1

image:
  repository: ghcr.io/michidk/roastbook
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: roastbook.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 2
  failureThreshold: 30

terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true

# MCP requires an owner-bound bearer token. Network restrictions are optional
# extra protection for the dedicated device Service.
mcp:
  enabled: false
  # Required when enabled: at least one of these two source lists.
  allowedCidrs: [] # e.g. a VPN or tailnet range
  allowedNamespaces: [] # namespace names whose Pods may connect
  # Extra Host names clients use (for example a VPN DNS name). The in-cluster
  # Service names are always allowed; localhost is always allowed.
  allowedHosts: []
  # Extra Origin hostnames. Native MCP clients send no Origin.
  allowedOrigins: []

# Requests per account shared by API keys, MCP tokens and MCP applications.
integrations:
  rateLimit:
    perMinute: 120
    perDay: 5000

migrations:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  hook:
    enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

postgresql:
  # Enable bundled PostgreSQL
  enabled: false
  image:
    repository: postgres
    tag: "18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: "roastbook"
    username: "roastbook"
    password: ""
  primary:
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    persistence:
      enabled: true
      size: "5Gi"
      storageClass: ""
  # For external database (when enabled: false)
  external:
    url: ""
    host: ""
    port: "5432"
  existingSecret: ""
  existingSecretKey: "url"

storage:
  provider: "local"
  local:
    path: "/data/uploads"
    size: "10Gi"
    storageClass: ""
    # Multi-replica deployments require ReadWriteMany storage. Prefer S3 unless
    # the selected storage class provides a shared RWX filesystem.
    accessMode: "ReadWriteOnce"
  s3:
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    existingSecret: ""
    existingSecretAccessKeyIdKey: "access-key-id"
    existingSecretSecretAccessKeyKey: "secret-access-key"

openai:
  # Secret for encrypting user-supplied AI provider keys.
  credentialExistingSecret: ""
  credentialExistingSecretKey: "encryption-key"
  allowedPrivateOrigins: []
  # Request log: store prompts and responses only for short diagnostics.
  telemetryStorePayloads: false

# Optional server-side image-edit cost analytics. No picture content is sent.
posthog:
  existingSecret: ""
  existingSecretProjectKeyKey: "project-key"
  host: "https://eu.i.posthog.com"

hodor:
  enabled: true
  existingSecret: ""
  password: ""
  # Leave empty to generate once; Helm reuses the existing value on upgrades.
  secret: ""
  existingSecretPasswordKey: "password"
  existingSecretSecretKey: "secret"
  image:
    repository: ghcr.io/michidk/hodor
    tag: "@sha256:133a617076bea11ea1b7e41a93145bfd2867516f4b865e37fa3bf41638a65cf7"
    digest: "sha256:a3df75a6d24d4de620e3b48489b3dfa3d57e9c09ad52c812bf3bac49f3b45cde"
    pullPolicy: IfNotPresent
  title: "Roastbook Login"
  sessionTtl: "86400"
  # Automatically enabled when ingress.tls is configured.
  secureCookie: false
  logFormat: "compact"
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

# Passwordless accounts. Set hodor.enabled=false when using built-in login.
auth:
  enabled: false
  # Secret containing PUBLIC_URL (unless publicUrl is set), AUTH_SECRET, EMAIL_FROM, SMTP_URL or RESEND_API_KEY,
  # and optional DEPLOYMENT_MODE, AUTH_ADMIN_EMAIL, AUTH_ALLOWED_EMAILS,
  # AUTH_SIGNUP_ENABLED (comma-separated email lists; signup closed by default).
  existingSecret: ""

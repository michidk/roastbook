replicaCount: 1

demoMode: false

image:
  repository: ghcr.io/michidk/roastbook
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: roastbook.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 2
  failureThreshold: 30

terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true

migrations:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  hook:
    enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

postgresql:
  # Enable bundled PostgreSQL
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    database: "roastbook"
    username: "roastbook"
    password: ""
  primary:
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    persistence:
      enabled: true
      size: "5Gi"
      storageClass: ""
  # For external database (when enabled: false)
  external:
    url: ""
    host: ""
    port: "5432"
  existingSecret: ""
  existingSecretKey: "url"

storage:
  provider: "local"
  local:
    path: "/data/uploads"
    size: "10Gi"
    storageClass: ""
    # Multi-replica deployments require ReadWriteMany storage. Prefer S3 unless
    # the selected storage class provides a shared RWX filesystem.
    accessMode: "ReadWriteOnce"
  s3:
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    existingSecret: ""
    existingSecretAccessKeyIdKey: "access-key-id"
    existingSecretSecretAccessKeyKey: "secret-access-key"

openai:
  existingSecret: ""
  existingSecretKey: "api-key"
  baseUrl: ""  # e.g., "https://openrouter.ai/api/v1" for OpenRouter
  visionModel: "gpt-4o"  # e.g., "openai/gpt-4o" for OpenRouter
  researchModel: "gpt-4o"

hodor:
  enabled: true
  existingSecret: ""
  password: ""
  # Leave empty to generate once; Helm reuses the existing value on upgrades.
  secret: ""
  existingSecretPasswordKey: "password"
  existingSecretSecretKey: "secret"
  image:
    repository: ghcr.io/michidk/hodor
    tag: ""
    digest: "sha256:7cdb5de7ee2c776ee6c2ae049e1b2050caa60288d7b3148e26117a5d6bba18b2"
    pullPolicy: IfNotPresent
  title: "Roastbook Login"
  sessionTtl: "86400"
  # Automatically enabled when ingress.tls is configured.
  secureCookie: false
  logFormat: "compact"
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi

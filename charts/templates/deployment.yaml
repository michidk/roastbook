{{- $multiReplica := or (gt (int .Values.replicaCount) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1)) -}}
{{- if and (eq .Values.storage.provider "local") $multiReplica (ne .Values.storage.local.accessMode "ReadWriteMany") -}}
{{- fail "multi-replica deployments cannot use local ReadWriteOnce storage; set storage.provider=s3 or select shared storage with storage.local.accessMode=ReadWriteMany" -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) (int .Values.autoscaling.maxReplicas)) -}}
{{- fail "autoscaling.minReplicas cannot exceed autoscaling.maxReplicas" -}}
{{- end -}}
{{- if and .Values.mcp.enabled (not .Values.networkPolicy.enabled) -}}
{{- fail "networkPolicy.enabled must be true when MCP is enabled to restrict the dedicated integration Service" -}}
{{- end -}}
{{- if and .Values.mcp.enabled (not .Values.mcp.allowedCidrs) (not .Values.mcp.allowedNamespaces) -}}
{{- fail "mcp.allowedCidrs or mcp.allowedNamespaces is required when MCP is enabled" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roastbook.fullname" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and (eq .Values.storage.provider "local") (ne .Values.storage.local.accessMode "ReadWriteMany") }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "roastbook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "roastbook.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "roastbook.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- include "roastbook.applicationEnvironment" . | nindent 10 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.storage.provider "local" }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.storage.local.path }}
          {{- end }}
        {{- if .Values.auth.enabled }}
        - name: account-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["bun", "run", "worker"]
          {{- include "roastbook.applicationEnvironment" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.storage.provider "local" }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.storage.local.path }}
          {{- end }}
        {{- end }}
        {{- if .Values.hodor.enabled }}
        - name: hodor
          {{- if .Values.hodor.image.digest }}
          image: "{{ .Values.hodor.image.repository }}@{{ .Values.hodor.image.digest }}"
          {{- else }}
          image: "{{ .Values.hodor.image.repository }}:{{ required "hodor.image.tag or hodor.image.digest is required" .Values.hodor.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.hodor.image.pullPolicy }}
          ports:
            - name: gate
              containerPort: 8080
              protocol: TCP
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.hodor.existingSecret }}
                  name: {{ .Values.hodor.existingSecret }}
                  key: {{ .Values.hodor.existingSecretPasswordKey }}
                  {{- else }}
                  name: {{ include "roastbook.fullname" . }}-hodor
                  key: password
                  {{- end }}
            - name: UPSTREAM
              value: "http://localhost:3000"
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.hodor.existingSecret }}
                  name: {{ .Values.hodor.existingSecret }}
                  key: {{ .Values.hodor.existingSecretSecretKey }}
                  {{- else }}
                  name: {{ include "roastbook.fullname" . }}-hodor
                  key: secret
                  {{- end }}
            - name: TITLE
              value: {{ .Values.hodor.title | quote }}
            - name: SESSION_TTL
              value: {{ .Values.hodor.sessionTtl | quote }}
            - name: SECURE_COOKIE
              value: {{ or .Values.hodor.secureCookie (not (empty .Values.ingress.tls)) | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.hodor.logFormat | quote }}
            # The REST API (including shottimer devices) authenticates with its own keys.
            - name: BYPASS_PATHS
              value: "/api/v1,/api/v1/*"
          livenessProbe:
            httpGet:
              path: /_gate/health
              port: gate
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_gate/health
              port: gate
            initialDelaySeconds: 2
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /_gate/health
              port: gate
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.hodor.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.storage.provider "local" }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "roastbook.fullname" . }}-uploads
      {{- end }}

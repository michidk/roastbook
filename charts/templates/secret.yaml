{{- if and .Values.hodor.enabled (not .Values.hodor.existingSecret) }}
{{- $secretName := printf "%s-hodor" (include "roastbook.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $signingSecret := .Values.hodor.secret -}}
{{- if and (empty $signingSecret) $existingSecret $existingSecret.data (hasKey $existingSecret.data "secret") -}}
{{- $signingSecret = (index $existingSecret.data "secret" | b64dec) -}}
{{- end -}}
{{- if empty $signingSecret -}}
{{- $signingSecret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "hodor.password is required when hodor is enabled" .Values.hodor.password | quote }}
  secret: {{ $signingSecret | quote }}
{{- end }}
---
{{- if and (not .Values.postgresql.existingSecret) (not .Values.postgresql.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roastbook.dbSecretName" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "roastbook.databaseUrl" . | quote }}
{{- end }}
{{- if and .Values.migrations.enabled .Values.migrations.hook.enabled (not .Values.postgresql.existingSecret) (not .Values.postgresql.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roastbook.migrationDbSecretName" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  url: {{ include "roastbook.databaseUrl" . | quote }}
{{- end }}

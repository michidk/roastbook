{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "roastbook.fullname" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "roastbook.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ ternary 8080 3000 .Values.hodor.enabled }}
{{- end }}

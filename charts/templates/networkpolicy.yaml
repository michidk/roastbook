{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "roastbook.fullname" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "roastbook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ ternary 8080 3000 .Values.hodor.enabled }}
    {{- if and .Values.mcp.enabled .Values.hodor.enabled }}
    # Unauthenticated MCP on the app port, limited to private sources.
    - from:
        {{- range .Values.mcp.allowedCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.mcp.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
    {{- end }}
{{- end }}

{{- $multiReplica := or (gt (int .Values.replicaCount) 1) (and .Values.autoscaling.enabled (gt (int .Values.autoscaling.maxReplicas) 1)) -}}
{{- if and .Values.podDisruptionBudget.enabled $multiReplica }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "roastbook.fullname" . }}
  labels:
    {{- include "roastbook.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "roastbook.selectorLabels" . | nindent 6 }}
{{- end }}

services:
  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_DB: roastbook
      POSTGRES_USER: roastbook
      POSTGRES_PASSWORD: roastbook
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastbook -d roastbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      args:
        VITE_HEAD_HTML: ${VITE_HEAD_HTML:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook

  app:
    build:
      context: .
      args:
        VITE_HEAD_HTML: ${VITE_HEAD_HTML:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    ports:
      # MCP requires a per-user bearer token. Keep the direct device port private.
      - "127.0.0.1:${MCP_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      INTEGRATION_RATE_LIMIT_PER_MINUTE: ${INTEGRATION_RATE_LIMIT_PER_MINUTE:-120}
      INTEGRATION_RATE_LIMIT_PER_DAY: ${INTEGRATION_RATE_LIMIT_PER_DAY:-5000}
      AUTH_ENABLED: "false"
      PUBLIC_URL: ${PUBLIC_URL:-${AUTH_URL:-}}
      STORAGE_PROVIDER: local
      STORAGE_PATH: /uploads
      STORAGE_URL: /media
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_ALLOWED_PRIVATE_ORIGINS: ${AI_ALLOWED_PRIVATE_ORIGINS:-}
    volumes:
      - uploads:/uploads

  hodor:
    image: ${HODOR_IMAGE:-ghcr.io/michidk/hodor@sha256:133a617076bea11ea1b7e41a93145bfd2867516f4b865e37fa3bf41638a65cf7}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HODOR_PORT:-3000}:8080"
    environment:
      PASSWORD: ${HODOR_PASSWORD:?Set HODOR_PASSWORD in .env}
      SECRET: ${HODOR_SECRET:?Set HODOR_SECRET in .env}
      UPSTREAM: http://app:3000
      TITLE: ${HODOR_TITLE:-Roastbook Login}
      SESSION_TTL: ${HODOR_SESSION_TTL:-86400}
      SECURE_COOKIE: ${HODOR_SECURE_COOKIE:-false}
      LOG_FORMAT: ${HODOR_LOG_FORMAT:-compact}
      # The REST API (including shottimer devices) authenticates with its own keys.
      BYPASS_PATHS: /api/v1,/api/v1/*

volumes:
  postgres_data:
  uploads:

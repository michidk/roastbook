services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: roastbook
      POSTGRES_USER: roastbook
      POSTGRES_PASSWORD: roastbook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastbook -d roastbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://roastbook:roastbook@postgres:5432/roastbook
      STORAGE_PROVIDER: local
      STORAGE_PATH: /uploads
      STORAGE_URL: /media
      # OPENAI_API_KEY: sk-...
      # OPENAI_BASE_URL: https://api.openai.com/v1
      # OPENAI_VISION_MODEL: gpt-4o
      # OPENAI_RESEARCH_MODEL: gpt-4o
    volumes:
      - uploads:/uploads

  hodor:
    image: ${HODOR_IMAGE:-ghcr.io/michidk/hodor@sha256:7cdb5de7ee2c776ee6c2ae049e1b2050caa60288d7b3148e26117a5d6bba18b2}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HODOR_PORT:-3000}:8080"
    environment:
      PASSWORD: ${HODOR_PASSWORD:?Set HODOR_PASSWORD in .env}
      SECRET: ${HODOR_SECRET:?Set HODOR_SECRET in .env}
      UPSTREAM: http://app:3000
      TITLE: ${HODOR_TITLE:-Roastbook Login}
      SESSION_TTL: ${HODOR_SESSION_TTL:-86400}
      SECURE_COOKIE: ${HODOR_SECURE_COOKIE:-false}
      LOG_FORMAT: ${HODOR_LOG_FORMAT:-compact}

volumes:
  postgres_data:
  uploads:

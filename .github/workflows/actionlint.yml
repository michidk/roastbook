# @orcastrate
# template: common/actionlint
# @end-orcastrate

name: Validate workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Actions expressions, permissions, and shell scripts
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore 'label "ubuntu-26\.04" is unknown'
          .github/workflows/*.yml

# @orcastrate
# template: projects/roastbook/ci
# @end-orcastrate

name: Checks and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: checks-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_DB: roastbook_test
          POSTGRES_USER: roastbook
          POSTGRES_PASSWORD: roastbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roastbook -d roastbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://roastbook:roastbook@localhost:5432/roastbook_test
      AI_CREDENTIAL_ENCRYPTION_KEY: Hx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8fHx8=
      TEST_DATABASE_URL: postgresql://roastbook:roastbook@localhost:5432/roastbook_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: roastbook-test
      TEST_S3_SECRET_ACCESS_KEY: roastbook-test-secret
      TEST_S3_BUCKET: roastbook-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Validate Docker Compose
        env:
          HODOR_PASSWORD: ci-password
          HODOR_SECRET: ci-signing-secret
        run: |
          docker compose config --quiet
          AUTH_URL=https://coffee.example.test \
          AUTH_SECRET=ci-auth-secret-at-least-thirty-two-characters \
          EMAIL_FROM=coffee@example.test SMTP_URL=smtp://localhost:1025 \
            docker compose -f docker-compose.auth.yaml config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate Helm chart
        run: |
          helm lint charts \
            --set hodor.password=ci-password \
            --set hodor.secret=ci-signing-secret \
            --set postgresql.external.url=postgresql://roastbook:password@postgres.example:5432/roastbook
          helm lint charts \
            --set hodor.password=ci-password \
            --set hodor.secret=ci-signing-secret \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=database-password

          helm lint charts \
            --set auth.enabled=true \
            --set auth.existingSecret=roastbook-auth \
            --set hodor.enabled=false \
            --set postgresql.external.url=postgresql://roastbook:password@postgres.example:5432/roastbook

      - name: Check PostgreSQL migration metadata and schema drift
        run: |
          bun --bun drizzle-kit check --config=drizzle.config.ts
          bun run db:generate
          changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [ -n "$changes" ]; then
            echo "PostgreSQL schema changes require committed migrations and metadata:"
            echo "$changes"
            exit 1
          fi

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Start S3-compatible test storage
        run: |
          docker run --detach --name roastbook-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            docker.io/bitnamilegacy/minio@sha256:ba958aa5e12c8b1426dd95de61d8f1ed14741efa0ec730019ed57086930a4299
          for attempt in {1..30}; do
            echo "Waiting for test storage, attempt $attempt/30"
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs roastbook-minio
          exit 1

      - name: Test units with coverage
        run: bun run test:coverage

      - name: Test integrations
        run: bun run test:integration

      - name: Check for dead code
        run: bun run lint:deadcode

      - name: Build production assets
        run: bun run build

      - name: Check generated route tree
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Enforce client bundle budget
        run: bun run check:client-assets

      - name: Validate PWA assets
        run: bun run check:pwa

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check Workers target
        run: bunx tsc --noEmit -p tsconfig.cloudflare.json

      - name: Check D1 migration metadata and schema drift
        run: |
          bun --bun drizzle-kit check --config=drizzle.d1.config.ts
          bun --bun drizzle-kit generate --config=drizzle.d1.config.ts
          changes="$(git status --porcelain --untracked-files=all -- drizzle-d1)"
          if [ -n "$changes" ]; then
            echo "D1 schema changes require committed migrations and metadata:"
            echo "$changes"
            exit 1
          fi

      - name: Verify D1 tenant and concurrency contracts
        run: bun run test:cloudflare

      - name: Verify Workers account jobs
        run: bun run test:cloudflare:jobs

      - name: Build immutable Workers release
        run: bun run build:cloudflare

      - name: Validate hosted client assets and PWA
        run: |
          bun run check:client-assets .output/cloudflare/public
          bun run check:pwa .output/cloudflare/public

      - name: Verify production Workers artifact and OAuth
        run: bun run test:cloudflare:release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roastbook-cloudflare
          path: .output/cloudflare/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build database-free demo and verify retiring service worker
        run: bun run build:demo

      - name: Validate demo client assets
        run: bun run check:client-assets .vercel/output/static

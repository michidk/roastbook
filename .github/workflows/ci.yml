name: Checks and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: checks-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: roastbook_test
          POSTGRES_USER: roastbook
          POSTGRES_PASSWORD: roastbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roastbook -d roastbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://roastbook:roastbook@localhost:5432/roastbook_test
      TEST_DATABASE_URL: postgresql://roastbook:roastbook@localhost:5432/roastbook_test
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_ACCESS_KEY_ID: roastbook-test
      TEST_S3_SECRET_ACCESS_KEY: roastbook-test-secret
      TEST_S3_BUCKET: roastbook-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Check generated route tree
        run: |
          bun run generate-routes
          git diff --exit-code -- src/routeTree.gen.ts

      - name: Validate Docker Compose
        env:
          HODOR_PASSWORD: ci-password
          HODOR_SECRET: ci-signing-secret
        run: docker compose config --quiet

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Validate Helm chart
        run: |
          helm lint charts \
            --set hodor.password=ci-password \
            --set hodor.secret=ci-signing-secret \
            --set postgresql.external.url=postgresql://roastbook:password@postgres.example:5432/roastbook
          helm lint charts \
            --set hodor.password=ci-password \
            --set hodor.secret=ci-signing-secret \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=database-password

      - name: Apply database migrations
        run: bun run db:migrate

      - name: Start S3-compatible test storage
        run: |
          docker run --detach --name roastbook-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs roastbook-minio
          exit 1

      - name: Test units
        run: bun run test:unit

      - name: Test integrations
        run: bun run test:integration

      - name: Check for dead code
        run: bun run lint:deadcode

      - name: Build production assets
        run: bun run build

      - name: Enforce client bundle budget
        run: bun run check:client-assets

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

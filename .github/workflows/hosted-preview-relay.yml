name: Hosted deployment relay

on:
  workflow_run:
    workflows: [Checks and Build]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [labeled, closed]
  release:
    types: [published]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: hosted-relay-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.event.release.id }}
  cancel-in-progress: false
  queue: max

jobs:
  relay:
    if: github.repository == 'michidk/roastbook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always load controller code from main, never the PR branch or release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Select current source events
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const relay = require('./.github/scripts/hosted-relay.cjs');
            const requests = await relay({github, context, core});
            core.setOutput('requests', JSON.stringify(requests));
      - name: Create infrastructure dispatch token
        if: steps.validate.outputs.requests != '[]'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.PREVIEW_DISPATCH_APP_ID }}
          private-key: ${{ secrets.PREVIEW_DISPATCH_APP_PRIVATE_KEY }}
          owner: michidk
          repositories: roastbook-infra
          permission-contents: write
      - name: Notify private infrastructure
        if: steps.validate.outputs.requests != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DISPATCH_REQUESTS: ${{ steps.validate.outputs.requests }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            for (const request of JSON.parse(process.env.DISPATCH_REQUESTS)) {
              await github.rest.repos.createDispatchEvent({
                owner: 'michidk', repo: 'roastbook-infra',
                event_type: request.event, client_payload: request.payload,
              });
            }

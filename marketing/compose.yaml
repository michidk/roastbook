services:
  database:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign-local-only
      POSTGRES_DB: roastbook_campaign
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - campaign-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d roastbook_campaign"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  campaign-data:
